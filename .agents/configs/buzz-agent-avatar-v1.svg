<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AI DevOps specialist avatar</title>
  <desc id="desc">A circular black profile icon with a spectrum-coloured terminal prompt mark, designed to remain clear when cropped by avatar interfaces.</desc>
  <defs>
    <linearGradient id="background" x1="170" y1="120" x2="850" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="{{BACKGROUND_TINT}}"/>
      <stop offset="0.58" stop-color="#030707"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="54%">
      <stop offset="0" stop-color="{{ACCENT}}" stop-opacity="0.24"/>
      <stop offset="0.56" stop-color="{{ACCENT_DARK}}" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="185" y1="125" x2="840" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="{{ACCENT_LIGHT}}"/>
      <stop offset="0.48" stop-color="{{ACCENT_MID}}"/>
      <stop offset="1" stop-color="{{ACCENT_DARK}}"/>
    </linearGradient>
    <clipPath id="avatar-circle">
      <circle cx="512" cy="512" r="504"/>
    </clipPath>
  </defs>

  <g clip-path="url(#avatar-circle)">
    <circle cx="512" cy="512" r="504" fill="url(#background)"/>
    <circle cx="512" cy="512" r="504" fill="url(#glow)"/>
    <path d="M94 704C250 620 371 622 518 692c168 80 312 70 435-10v334H60Z" fill="{{ACCENT}}" opacity="0.035"/>
    <path d="M70 751c162-98 302-101 455-30 169 78 313 62 439-28" fill="none" stroke="{{ACCENT}}" stroke-width="4" opacity="0.10"/>
  </g>

  <circle cx="512" cy="512" r="482" fill="none" stroke="url(#ring)" stroke-width="18" opacity="0.78"/>
  <circle cx="512" cy="512" r="451" fill="none" stroke="{{ACCENT}}" stroke-width="3" opacity="0.18"/>

  <g transform="translate(512 521) scale(1.08) translate(-288 -256)">
    <path fill="{{ACCENT_LIGHT}}" d="M9.4 86.6C-3.1 74.1-3.1 53.9 9.4 41.4s32.8-12.5 45.3 0l192 192c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L178.7 256 9.4 86.6zM256 416H544c17.7 0 32 14.3 32 32s-14.3 32-32 32H256c-17.7 0-32-14.3-32-32s14.3-32 32-32z"/>
  </g>
</svg>
