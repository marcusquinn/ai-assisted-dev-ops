# Test: .agents/reference/task-taxonomy.md (63 lines — simple reference doc)
file: .agents/reference/task-taxonomy.md
tier_minimum: simple

scenarios:
  - name: "routes SEO task correctly"
    prompt: "A task involves auditing keyword rankings and GSC data. What domain tag and GitHub label should it get? What agent handles it?"
    expected:
      contains:
        - "seo"
        - "SEO"
      min_length: 30
      max_length: 500
    reference_answer: |
      An SEO audit task should get the #seo TODO tag, the "seo" GitHub label,
      and be routed to the SEO agent.
    fast_fail_triggers:
      - refusal
      - confabulation

  - name: "identifies default code routing"
    prompt: "A task is to fix a bug in a shell script. What domain tag should it get?"
    expected:
      contains:
        - "none"
      not_contains:
        - "#code"
        - "#build"
      min_length: 20
      max_length: 500
    reference_answer: |
      Code tasks (features, bug fixes, refactors, CI, tests) get no domain tag.
      Build+ is the default agent and no label is needed.
    fast_fail_triggers:
      - refusal
      - confabulation

  - name: "identifies tier:simple usage"
    prompt: "When should the tier:simple label be applied to a task?"
    expected:
      contains:
        - "docs"
        - "disqualifier"
        - "exact"
      action:
        - "simple"
      min_length: 30
      max_length: 500
    reference_answer: |
      Docs-only changes, simple renames, formatting, and config tweaks may use
      tier:simple only when the work is prescriptive and mechanical and no
      disqualifier applies. More than two files, incomplete code, unresolved
      judgment or error handling, or an estimate over one hour require a higher
      tier; code edits need exact copy-pasteable blocks.
    fast_fail_triggers:
      - refusal
