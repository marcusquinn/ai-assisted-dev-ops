# Test: .agents/reference/task-taxonomy.md
file: .agents/reference/task-taxonomy.md
tier_minimum: simple

scenarios:
  - name: "routes SEO task correctly"
    prompt: "A task involves auditing keyword rankings and GSC data. What domain tag and GitHub label should it get? What agent handles it?"
    expected:
      contains:
        - "seo"
        - "SEO"
      min_length: 30
      max_length: 500
    reference_answer: |
      An SEO audit task should get the #seo TODO tag, the "seo" GitHub label,
      and be routed to the SEO agent.
    fast_fail_triggers:
      - refusal
      - confabulation

  - name: "identifies default code routing"
    prompt: "A task is to fix a bug in a shell script. What domain tag should it get?"
    expected:
      contains:
        - "none"
      not_contains:
        - "#code"
        - "#build"
      min_length: 20
      max_length: 500
    reference_answer: |
      Code tasks (features, bug fixes, refactors, CI, tests) get no domain tag.
      Build+ is the default agent and no label is needed.
    fast_fail_triggers:
      - refusal
      - confabulation

  - name: "identifies tier:simple usage"
    prompt: "When should the tier:simple label be applied to a task?"
    expected:
      contains:
        - "exact"
        - "reversible"
        - "contract"
      action:
        - "simple"
      min_length: 30
      max_length: 500
    reference_answer: |
      Apply tier:simple only when the task has a complete exact execution
      contract, verified targets and pattern, no unresolved semantic or recovery
      choice, bounded reversible low-consequence impact, and focused verification.
      Counts or isolated keywords are evidence rather than automatic gates.
    fast_fail_triggers:
      - refusal

  - name: "distinguishes bounded security implementation from trust-boundary design"
    prompt: "How should tiers differ for implementing a decided authentication pattern versus deciding a new authorization trust boundary?"
    expected:
      contains:
        - "standard"
        - "thinking"
        - "boundary"
      min_length: 40
      max_length: 500
    reference_answer: |
      Bounded authentication implementation inside an already decided boundary is
      normally tier:standard. Deciding or redesigning an authorization trust
      boundary is tier:thinking. A tier can never bypass an authority or policy gate.
    fast_fail_triggers:
      - refusal
