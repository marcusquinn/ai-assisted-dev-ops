# Test: .agents/reference/self-improvement.md (59 lines — moderate reference doc)
file: .agents/reference/self-improvement.md
tier_minimum: simple

scenarios:
  - name: "identifies framework vs project routing"
    prompt: "A bug is found in the supervisor pulse script at ~/.aidevops/agents/scripts/pulse-wrapper.sh. Should this be filed as a framework issue or a project issue? What tool should be used?"
    expected:
      contains:
        - "framework"
      not_contains:
        - "project"
        - "current repo"
      min_length: 40
      max_length: 600
    reference_answer: |
      This is a framework-level issue because it involves files under ~/.aidevops/
      and framework scripts. Use framework-issue-helper.sh log to file it on
      marcusquinn/aidevops. Never create framework tasks in project repos.
    fast_fail_triggers:
      - refusal
      - confabulation

  - name: "identifies correct response to failure pattern"
    prompt: "Multiple PRs are failing CI with the same shellcheck error. What should the agent do?"
    expected:
      contains:
        - "issue"
      not_contains:
        - "workaround"
        - "ignore"
      min_length: 30
      max_length: 500
    reference_answer: |
      File an issue describing the pattern, root cause hypothesis, and proposed
      fix. Never patch around a broken process -- fix the process.
    fast_fail_triggers:
      - refusal

  - name: "auto-dispatches a created implementation issue without another approval"
    prompt: "You found a well-specified, reversible framework bug that is too large for the active session. You have maintainer authority and are creating an implementation issue. Should it receive no-auto-dispatch while waiting for the user to approve implementation?"
    expected:
      contains:
        - "auto-dispatch"
      not_contains:
        - "ask the user"
        - "no-auto-dispatch"
        - "wait for approval"
      min_length: 35
      max_length: 500
    reference_answer: |
      Create the worker-ready issue with auto-dispatch immediately. Publishing
      the implementation issue is already the decision to implement it, so do
      not ask for a second dispatch approval. Reserve a manual hold for an
      explicit, recorded safety or authority reason.
    fast_fail_triggers:
      - refusal
