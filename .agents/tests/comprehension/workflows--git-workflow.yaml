# Test: .agents/workflows/git-workflow.md (complex workflow doc)
file: .agents/workflows/git-workflow.md
tier_minimum: standard

scenarios:
  - name: "identifies pre-edit gate"
    prompt: "Before editing any file, what gate must the agent run? What happens if it reports the canonical checkout?"
    expected:
      contains:
        - "pre-edit-check"
        - "stop"
        - "worktree"
      not_contains:
        - "proceed"
        - "continue editing"
      min_length: 30
      max_length: 500
    reference_answer: |
      Run pre-edit-check.sh before every edit. If it reports the canonical
      checkout, stop and create a safe linked worktree; branch inspection alone
      cannot prove that the checkout is safe to edit.
    fast_fail_triggers:
      - refusal
      - structural_violation

  - name: "identifies PR title format"
    prompt: "What format must PR titles follow? Give an example."
    expected:
      contains:
        - "task-id"
      not_contains:
        - "qd-"
      min_length: 30
      max_length: 500
    reference_answer: |
      PR titles must follow {task-id}: {description}. Task ID is tNNN (from
      TODO.md) or GH#NNN (GitHub issue number). Examples: t318: Update PR
      workflow documentation, GH#12455: tighten hashline-edit-format.md.
      Never use qd-, bare numbers, or invented prefixes.
    fast_fail_triggers:
      - refusal
      - confabulation

  - name: "identifies destructive command safety"
    prompt: "Is 'git push --force' allowed? What about 'git push --force-with-lease'?"
    expected:
      contains:
        - "blocked"
        - "force-with-lease"
      min_length: 30
      max_length: 500
    reference_answer: |
      git push --force is blocked by the safety hooks. git push --force-with-lease
      is safe (allowlisted) because it prevents overwriting others' work.
    fast_fail_triggers:
      - refusal
      - structural_violation

  - name: "routes release artifacts to keyless provenance"
    prompt: "A repository publishes images and an update manifest from GitHub Actions. What provenance pattern should be assessed before changing its release workflow?"
    expected:
      contains:
        - "OIDC"
        - "exact"
        - "signer workflow"
        - "validated ref"
      not_contains:
        - "checksum is sufficient"
      min_length: 60
      max_length: 700
    reference_answer: |
      Assess unattended GitHub Actions OIDC/Sigstore provenance. Attest the exact
      artifact bytes or immutable image digest, then verify the repository, exact
      signer workflow, and already validated release ref before publication.
      Keep any native platform signing or consumer-enforced mechanism. Load
      reference/release-artifact-provenance.md for the full pattern.
    fast_fail_triggers:
      - refusal
      - security_violation
