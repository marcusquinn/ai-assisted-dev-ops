# Test: .agents/reference/agent-routing.md (69 lines — moderate routing doc)
file: .agents/reference/agent-routing.md
tier_minimum: simple

scenarios:
  - name: "identifies correct dispatch method"
    prompt: "How should workers be dispatched? Can you use bare 'claude run' or 'opencode' commands?"
    expected:
      contains:
        - "headless-runtime-helper.sh"
      not_contains:
        - "bare"
      min_length: 30
      max_length: 500
    reference_answer: |
      Workers must be dispatched with headless-runtime-helper.sh run, not bare
      runtime CLIs. The helper provides provider rotation, session persistence,
      backoff, and lifecycle reinforcement.
    fast_fail_triggers:
      - refusal
      - confabulation

  - name: "routes SEO task to correct agent"
    prompt: "A task is to run an SEO audit on landing pages. What --agent flag should be passed?"
    expected:
      contains:
        - "SEO"
        - "readiness"
        - "fallback"
      min_length: 10
      max_length: 300
    reference_answer: |
      Resolve SEO capability readiness first. Pass --agent SEO only when every
      mandatory readiness dimension is true; otherwise use the structured
      response's declared fallback.
    fast_fail_triggers:
      - refusal

  - name: "identifies default agent"
    prompt: "If a task is uncertain or clearly code work, what agent should be used?"
    expected:
      contains:
        - "Build+"
      min_length: 10
      max_length: 300
    reference_answer: |
      Default to Build+ for code work or when uncertain. It can load narrower
      docs on demand.
    fast_fail_triggers:
      - refusal

  - name: "offloads output-heavy work from a thinking parent"
    prompt: "A thinking-tier interactive parent needs three independent, verbose repository and CI investigations, but only their conclusions matter. How should it route the work?"
    expected:
      contains:
        - "simple"
        - "standard"
        - "parallel"
        - "evidence"
        - "critical path"
      min_length: 60
      max_length: 700
    reference_answer: |
      The parent's thinking tier does not force thinking-tier children. Keep
      synthesis and the active critical path in the parent. Send up to two
      independent investigations in one parallel batch at the lowest reliable
      simple or standard tier, then run the remaining child only after that
      batch returns. Each child should return a final-only decision, path/line
      or command evidence, uncertainty, and next action so verbose raw output
      stays out of the parent context. Keep a small low-output call direct when
      delegation overhead would cost more than it saves.
    fast_fail_triggers:
      - refusal
