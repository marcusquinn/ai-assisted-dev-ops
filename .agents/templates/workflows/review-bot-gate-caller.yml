name: Review Bot Gate

# Managed by aidevops framework.
# Upstream logic lives in: marcusquinn/aidevops/.github/workflows/review-bot-gate-reusable.yml
# This caller is tiny on purpose — all the logic is centralised upstream.
# Update this caller only to change the trigger filters below. For logic fixes,
# run `aidevops update` to get the latest framework version; your caller will
# pick up the change automatically (if pinned to @main) or on the next version
# bump + resync (if pinned to @v3.9.0 style).
#
# To manage this file:
#   aidevops check-workflows       # detect drift vs canonical template
#   aidevops sync-workflows        # preview resync plan
#   aidevops sync-workflows --apply
#
# The status may remain required for compatibility, but the permanent default
# is advisory: required project CI may merge without an add-on response. Set
# completion_behavior: strict explicitly to require review-before-merge.
#
# Local/Pulse completion uses `review_gate.completion_behavior` in repos.json.
# CI completion uses the `AIDEVOPS_REVIEW_GATE_COMPLETION_BEHAVIOR` repository
# Actions variable below. Both default to "fast"; set both to "strict" when a
# repository explicitly requires review-before-merge.
# See: .agents/reference/repos-json-fields.md "review_gate" field.
#
# Pinning options:
#   @main           ← auto-update; what this template uses by default
#   @v3.9.0         ← pin to a specific aidevops version for stability
#                     (bump via aidevops sync-workflows after upgrades)

# Permissions ceiling for downstream repos with default_workflow_permissions: read.
# Reusable workflow job-level permissions cannot exceed the caller's ceiling.
# This block sets the union of all job-level permissions used by review-bot-gate-reusable.yml.
permissions:
  pull-requests: read
  contents: read
  statuses: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    # edited re-triggers when CodeRabbit finalises its Phase 1 placeholder (t2139).
    # Without this trigger, the settlement check only fires on new comments, not
    # on the Phase 2 edit that makes the placeholder a real review.
    types: [created, edited]

jobs:
  gate:
    # Apply the complete event matrix before concurrency admission. GitHub keeps
    # only one pending run per group, so a skipped inline reply must never replace
    # the sole queued evaluator. The reusable job repeats this as defence-in-depth.
    # Retired Gemini actors remain only for historical/reinstall compatibility.
    if: >
      (
        github.event_name == 'pull_request' ||
        (
          (
            github.event_name == 'pull_request_review' ||
            (
              github.event_name == 'pull_request_review_comment' &&
              github.event.comment.in_reply_to_id == null
            ) ||
            (github.event_name == 'issue_comment' && github.event.issue.pull_request)
          ) &&
          (
            github.actor == 'coderabbitai' ||
            github.actor == 'coderabbitai[bot]' ||
            github.actor == 'gemini-code-assist' ||
            github.actor == 'gemini-code-assist[bot]' ||
            github.actor == 'augment-code' ||
            github.actor == 'augment-code[bot]' ||
            github.actor == 'augmentcode' ||
            github.actor == 'augmentcode[bot]' ||
            github.actor == 'copilot' ||
            github.actor == 'copilot[bot]' ||
            github.actor == 'github-actions[bot]'
          )
        )
      )
    # Do not cancel an active evaluator (GH#2973). Job-level placement is
    # required: ineligible workflow events skip before entering this group and
    # therefore cannot displace its one pending eligible run (GH#28316).
    concurrency:
      group: review-bot-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    uses: marcusquinn/aidevops/.github/workflows/review-bot-gate-reusable.yml@main
    with:
      # Keep this equal to the ref on `uses:` so helper code is pinned with the reusable YAML.
      aidevops_ref: main
      # Explicit CI opt-in: set this Actions variable to strict when required.
      completion_behavior: ${{ vars.AIDEVOPS_REVIEW_GATE_COMPLETION_BEHAVIOR || 'fast' }}
    secrets: inherit
