name: Issue Triage Gate

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: issue-triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Check author association and apply triage label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;
            const association = issue.author_association;
            const issueLabels = new Set((issue.labels || []).map(label => label.name));

            // Bot accounts always bypass triage (github-actions[bot], dependabot, etc.)
            if (issue.user.type === 'Bot') {
              console.log(`Author ${author} is a bot — bypassing triage`);
              return;
            }

            // OWNER/MEMBER are authoritative associations. COLLABORATOR can
            // represent read/triage access, so require a live write-level lookup.
            const trustedRoles = ['OWNER', 'MEMBER'];
            let authorIsTrusted = trustedRoles.includes(association);
            if (!authorIsTrusted && association === 'COLLABORATOR') {
              try {
                const permissionResponse = await github.request(
                  'GET /repos/{owner}/{repo}/collaborators/{username}/permission',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: author
                  }
                );
                authorIsTrusted = ['admin', 'maintain', 'write'].includes(
                  permissionResponse.data.permission
                );
              } catch (error) {
                core.warning(`Unable to verify collaborator permission for ${author}; treating as untrusted: ${error.message}`);
              }
            }

            if (authorIsTrusted) {
              console.log(`Author ${author} has role ${association} — bypassing triage`);

              // Remove needs-maintainer-review if the YAML form template added it
              if (issueLabels.has('needs-maintainer-review')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'needs-maintainer-review'
                  });
                } catch (error) {
                  core.warning(`Unable to remove stale review label: ${error.message}`);
                }
              }
              return;
            }

            // #aidevops:trust-boundary — persistent is itself an unconditional
            // dispatch blocker. Run trusted-author cleanup first so dashboards
            // do not retain a redundant NMR label; untrusted persistent issues
            // still stop here before any task lifecycle labels are added.
            if (issueLabels.has('persistent')) {
              console.log(`Issue #${issue.number} is persistent — bypassing task triage`);
              return;
            }

            console.log(`Author ${author} has role ${association} — applying triage gate`);

            // Apply the critical trust label before cleanup/comment calls. Only
            // attempt label creation after addLabels reports a missing/invalid
            // label and getLabel independently confirms a 404.
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-maintainer-review']
              });
            } catch (addError) {
              if (![404, 422].includes(addError.status)) {
                throw addError;
              }
              let labelIsMissing = false;
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-maintainer-review'
                });
              } catch (lookupError) {
                if (lookupError.status === 404) {
                  labelIsMissing = true;
                } else {
                  throw addError;
                }
              }
              if (!labelIsMissing) {
                throw addError;
              }
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'needs-maintainer-review',
                description: 'External issue awaiting maintainer review before pipeline pickup',
                color: 'FBCA04'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-maintainer-review']
              });
            }

            // GH#18197: file-size-debt and function-complexity-debt issues are exclusively
            // machine-generated. A non-maintainer creating one is either a mistake or an
            // attempt to bypass the assignee gate. Strip the label and apply needs-maintainer-review.
            //
            // GH#18623: origin:worker is ALSO machine-only — strip it independently of
            // file-size-debt/function-complexity-debt. A non-maintainer opening an issue with
            // only the origin:worker label would previously keep that label, since the stripping
            // logic was nested inside the debt-label check.
            const debtLabels = ['file-size-debt', 'function-complexity-debt'];
            for (const debtLabel of debtLabels) {
              if (issueLabels.has(debtLabel)) {
                console.log(`Non-maintainer ${author} created issue with ${debtLabel} label — stripping label and gating`);
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: debtLabel
                  });
                } catch (e) {
                  // Label may not be present — fine
                }
              }
            }
            if (issueLabels.has('origin:worker')) {
              console.log(`Non-maintainer ${author} created issue with origin:worker label — stripping label`);
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'origin:worker'
                });
              } catch (e) {
                // Label may not be present — fine
              }
            }

            // Remove any auto-dispatch labels that could trigger the pipeline
            for (const label of ['status:available', 'auto-dispatch']) {
              if (!issueLabels.has(label)) {
                continue;
              }
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label
                });
              } catch (e) {
                // Label not present — fine
              }
            }

            // Post a welcome comment
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  `Thanks for the report, @${author}.`,
                  '',
                  'This issue has been queued for maintainer review. A maintainer will review it and either:',
                  '- **Approve** it using: `sudo aidevops approve issue ' + issue.number + '`',
                  '- **Ask for more information** if the report needs clarification',
                  '- **Close** it if it\'s a duplicate or out of scope',
                  '',
                  '**Tip:** For faster, higher-quality issue reporting, use `/log-issue-aidevops` in your AI assistant session. It gathers diagnostics automatically and checks for duplicates.'
                ].join('\n')
              });
            } catch (error) {
              core.warning(`Review label is applied but welcome comment failed: ${error.message}`);
            }
