name: Dependency Security

on:
  pull_request:
    paths:
      - "package.json"
      - "packages/**/package.json"
      - "bun.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "packages/**/package.json"
      - "bun.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Provision scanner prerequisite
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ripgrep
          fi

      - name: Enforce exact direct dependency pins
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output([
              "git", "ls-files", "package.json", "packages/**/package.json"
          ], text=True).splitlines()
          exact = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$")
          failures = []
          for manifest_name in tracked:
              manifest = json.loads(pathlib.Path(manifest_name).read_text())
              for section in ("dependencies", "devDependencies", "optionalDependencies"):
                  for dependency, version in manifest.get(section, {}).items():
                      if version.startswith("workspace:") or exact.fullmatch(version):
                          continue
                      failures.append(f"{manifest_name}: {section}.{dependency}={version}")
          if failures:
              print("Direct application dependencies must use exact versions:", file=sys.stderr)
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Verify locked install without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit disclosed vulnerabilities
        run: bun audit

      - name: Scan supply-chain indicators
        run: bash .agents/scripts/supply-chain-advisory-helper.sh scan .
