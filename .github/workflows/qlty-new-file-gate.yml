name: Qlty New-File Gate

# qlty-action/install otherwise resolves its moving `latest` release.
env:
  QLTY_VERSION: "0.643.0"

# t2068: block PRs that add brand-new source files shipping with any
# qlty smells.
#
# Complements `qlty-regression.yml` (t2065):
# - t2065 checks the *delta* across the whole tree and fails on a net
#   increase — catches debt accumulating in files that already exist.
# - t2068 (this workflow) scans *only newly-added files* and fails if
#   any of them contain a single smell — catches the "mega-module
#   lands already smelly and stays that way" failure mode.
#
# Override: apply the `new-file-smell-ok` label AND add a
# `## New File Smell Justification` section to the PR body.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # t2220/t3403: suppress concurrency-cancellation cascade on docs-only PRs.
    # `gh pr create --label "a,b,c,d"` fires one `labeled` event per label
    # after the initial `opened`; each event can trigger a new run. When this
    # workflow used `cancel-in-progress: true`, label runs cancelled the
    # in-flight required check before job-level guards could skip them. Docs-only
    # PRs observed 15+ cancelled runs per workflow, which `gh pr checks`
    # then surfaces as `fail` (it displays `cancelled` conclusions as
    # `fail` in its TSV output). Filtering docs-only at the trigger
    # level reduces no-op runs; keeping cancel-in-progress disabled prevents
    # label events on mixed PRs from cancelling required checks. In-workflow
    # `detect-new-files` still runs as a belt-and-suspenders check.
    paths-ignore:
      - '**/*.md'
      - 'todo/**'

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-new-files:
    name: Detect new files
    runs-on: ubuntu-latest
    # t2231/t3403: fast-fail gate — skip entirely when a labeled event is
    # unrelated to 'new-file-smell-ok'. Cascade can still fire N workflow runs
    # on bulk label application, but cancel-in-progress is disabled so these
    # cheap skipped runs cannot cancel the required scan from opened/synchronize.
    # unlabeled non-relevant events are handled by the shell guard inside the
    # step (inherited from t2068).
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'new-file-smell-ok'
    outputs:
      has_new_source: ${{ steps.check.outputs.has_new_source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Count new source files
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          # Guard: skip re-scan on label/unlabel events unrelated to 'new-file-smell-ok'.
          # Only adding or removing 'new-file-smell-ok' warrants a rescan; other label
          # changes (e.g. 'status:in-review', 'origin:worker') are noise.
          if { [ "${EVENT_ACTION}" = "labeled" ] || [ "${EVENT_ACTION}" = "unlabeled" ]; } && \
             [ "${LABEL_NAME}" != "new-file-smell-ok" ]; then
            echo "Skipping: ${EVENT_ACTION} event for '${LABEL_NAME}' is not 'new-file-smell-ok' — no rescan needed."
            echo "has_new_source=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" || true)
          if [ -z "$added" ]; then
            echo "No added files; skipping new-file gate."
            echo "has_new_source=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Added files:\n%s\n' "$added"
          # Coarse source-extension prefilter — identical in intent to
          # is_source_file() in the helper, but implemented with a regex
          # here so we can decide whether to spin up the qlty job at all.
          src=$(printf '%s\n' "$added" | grep -E '\.(py|pyi|js|mjs|cjs|jsx|ts|tsx|sh|bash|zsh|rb|erb|go|rs|java|kt|swift|c|cpp|cc|cxx|h|hpp|php|ex|exs)$' || true)
          if [ -z "$src" ]; then
            echo "No new source files of recognised types; skipping."
            echo "has_new_source=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Candidate new source files:\n%s\n' "$src"
            echo "has_new_source=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    name: Qlty New-File Smell Gate
    runs-on: ubuntu-latest
    needs: detect-new-files
    if: needs.detect-new-files.outputs.has_new_source == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Qlty CLI
        uses: qltysh/qlty-action/install@a19242102d17e497f437d7466aa01b528537e899 # v2.2.0

      - name: Run new-file gate helper
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          .agents/scripts/qlty-new-file-gate-helper.sh new-files \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output-md /tmp/qlty-new-file-report.md \
            --sarif /tmp/qlty-new-file.sarif
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "---- report ----"
          cat /tmp/qlty-new-file-report.md || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qlty-new-file-gate-${{ github.event.pull_request.number }}
          path: |
            /tmp/qlty-new-file-report.md
            /tmp/qlty-new-file.sarif
          retention-days: 14
          if-no-files-found: ignore

      - name: Post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body_file=/tmp/qlty-new-file-report.md
          if [ ! -s "$body_file" ]; then
            echo "No report to post."
            exit 0
          fi
          marker="<!-- qlty-new-file-gate -->"
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | .[0] // empty" \
            2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "Updating existing comment $existing"
            gh api "repos/${REPO}/issues/comments/${existing}" \
              --method PATCH -F body=@"$body_file" >/dev/null 2>&1 || true
          else
            echo "Creating new comment"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body_file" \
              >/dev/null 2>&1 || true
          fi

      - name: Enforce gate
        env:
          HAS_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'new-file-smell-ok') }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_BODY: ${{ github.event.pull_request.body }}
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$EXIT_CODE" = "0" ]; then
            echo "Qlty new-file gate: no smells in new files."
            exit 0
          fi
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::Helper exited with unexpected code: $EXIT_CODE"
            exit 1
          fi
          if [ "$HAS_OVERRIDE" != "true" ]; then
            echo "::error::New file(s) ship with qlty smells. Apply the 'new-file-smell-ok' label AND add a '## New File Smell Justification' section to the PR description to override (maintainer only)."
            exit 1
          fi
          # t2133: new-file-smell-ok requires maintainer (OWNER/MEMBER) authorship.
          # Workers cannot self-override — prevents workers from gaming the gate.
          if [ "$AUTHOR_ASSOC" != "OWNER" ] && [ "$AUTHOR_ASSOC" != "MEMBER" ]; then
            echo "::error::New file(s) ship with qlty smells. 'new-file-smell-ok' override requires OWNER or MEMBER authorship (got: ${AUTHOR_ASSOC}). Ask a maintainer to apply the label if justified."
            exit 1
          fi
          # Override label is set by maintainer — require the justification section in the body.
          if printf '%s' "$PR_BODY" | grep -qE '^##+[[:space:]]+New File Smell Justification'; then
            echo "::warning::Qlty new-file gate: smells detected but 'new-file-smell-ok' label + justification section present (maintainer override) — allowing with warning."
            exit 0
          fi
          echo "::error::'new-file-smell-ok' label is set but the PR description is missing a '## New File Smell Justification' section. Add the section with a rationale for why the new file(s) may legitimately ship with smells, then push again."
          exit 1
