name: Postflight Verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact release tag to verify'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || github.sha }}
  cancel-in-progress: true

jobs:
  postflight:
    name: Verify Release Health
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    
    permissions:
      actions: read
      contents: read
      checks: read
      security-events: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Resolve release commit
      id: release_commit
      env:
        RELEASE_TAG: ${{ github.event.inputs.tag }}
      run: |
        #aidevops:trust-boundary
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
          echo "::error::Postflight must run from reviewed main"
          exit 1
        }
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "::error::Invalid release tag: $RELEASE_TAG"
          exit 1
        }
        git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" || {
          echo "::error::Release tag is unavailable: $RELEASE_TAG"
          exit 1
        }
        RELEASE_COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}") || {
          echo "::error::Release tag does not resolve to a commit: $RELEASE_TAG"
          exit 1
        }
        [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
          echo "::error::Release tag commit is malformed"
          exit 1
        }
        echo "sha=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Prepare reviewed postflight runtime
      id: postflight_runtime
      run: |
        [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
          echo "::error::Postflight workflow commit is malformed"
          exit 1
        }
        RUNTIME_PATH="$RUNNER_TEMP/postflight-runtime"
        git cat-file -e "${GITHUB_SHA}^{commit}" || {
          echo "::error::Postflight workflow commit is unavailable"
          exit 1
        }
        git worktree add --detach "$RUNTIME_PATH" "$GITHUB_SHA"
        echo "path=$RUNTIME_PATH" >> "$GITHUB_OUTPUT"
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: latest
    
    - name: Wait for CI/CD Pipelines
      env:
        GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ steps.release_commit.outputs.sha }}
        RELEASE_TAG: ${{ github.event.inputs.tag || '' }}
        POSTFLIGHT_RUNTIME: ${{ steps.postflight_runtime.outputs.path }}
      run: |
        echo "Waiting for release-owned check runs to complete..."
        echo "Note: Excluding issue/comment workflows and this workflow to avoid unrelated waits"
        sleep 60  # Initial wait for workflows to start
        
        # Poll for completion, excluding this workflow to avoid circular dependency
        SELF_NAME="Verify Release Health"
        COMPLETE_STREAK=0
        STABLE_COMPLETE=false
        for i in {1..20}; do
          CHECK_RUNS_RESPONSE=$(gh api --paginate --slurp \
            "repos/${REPO}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
            | jq -c -f "$POSTFLIGHT_RUNTIME/.agents/scripts/jq/flatten-check-run-pages.jq")
          RELEASE_RUNS_RESPONSE=$(gh api --paginate --slurp \
            "repos/${REPO}/actions/runs?head_sha=${COMMIT_SHA}&per_page=100")
          RECOVERY_RUNS_RESPONSE=$(gh api --paginate --slurp \
            "repos/${REPO}/actions/workflows/publish-packages.yml/runs?event=workflow_dispatch&branch=main&per_page=100")
          RELEASE_CHECK_RUNS=$(jq -c \
            --arg release_sha "$COMMIT_SHA" \
            --arg release_tag "$RELEASE_TAG" \
            --arg self_name "$SELF_NAME" \
            --slurpfile release_run_documents <(printf '%s\n' "$RELEASE_RUNS_RESPONSE") \
            --slurpfile recovery_run_documents <(printf '%s\n' "$RECOVERY_RUNS_RESPONSE") \
            -f "$POSTFLIGHT_RUNTIME/.agents/scripts/jq/release-owned-check-runs.jq" \
            <<<"$CHECK_RUNS_RESPONSE")
          PENDING=$(jq --arg self_name "$SELF_NAME" \
            '[.check_runs[] | select(.status != "completed")] | length' \
            <<<"$RELEASE_CHECK_RUNS")
          
          if [[ "$PENDING" == "0" ]]; then
            COMPLETE_STREAK=$((COMPLETE_STREAK + 1))
            if [[ "$COMPLETE_STREAK" -ge 2 ]]; then
              STABLE_COMPLETE=true
              echo "Release-owned checks remained terminal across two snapshots"
              break
            fi
            echo "Required checks appear terminal; confirming after 30 seconds"
          else
            COMPLETE_STREAK=0

            # Show which workflows are still pending
            echo "Waiting for $PENDING check runs... (attempt $i/20)"
            jq -r --arg self_name "$SELF_NAME" \
              '.check_runs[] | select(.status != "completed") | "  - \(.name): \(.status)"' \
              <<<"$RELEASE_CHECK_RUNS" || true
          fi
          sleep 30
        done

        if [[ "$STABLE_COMPLETE" != "true" ]]; then
          echo "::error::Release-owned checks did not reach a stable terminal state"
          exit 1
        fi

        # Final refresh catches a check that appeared after the quiescence window.
        CHECK_RUNS_RESPONSE=$(gh api --paginate --slurp \
          "repos/${REPO}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
          | jq -c -f "$POSTFLIGHT_RUNTIME/.agents/scripts/jq/flatten-check-run-pages.jq")
        RELEASE_RUNS_RESPONSE=$(gh api --paginate --slurp \
          "repos/${REPO}/actions/runs?head_sha=${COMMIT_SHA}&per_page=100")
        RECOVERY_RUNS_RESPONSE=$(gh api --paginate --slurp \
          "repos/${REPO}/actions/workflows/publish-packages.yml/runs?event=workflow_dispatch&branch=main&per_page=100")
        RELEASE_CHECK_RUNS=$(jq -c \
          --arg release_sha "$COMMIT_SHA" \
          --arg release_tag "$RELEASE_TAG" \
          --arg self_name "$SELF_NAME" \
          --slurpfile release_run_documents <(printf '%s\n' "$RELEASE_RUNS_RESPONSE") \
          --slurpfile recovery_run_documents <(printf '%s\n' "$RECOVERY_RUNS_RESPONSE") \
          -f "$POSTFLIGHT_RUNTIME/.agents/scripts/jq/release-owned-check-runs.jq" \
          <<<"$CHECK_RUNS_RESPONSE")
        REMAINING=$(jq '[.check_runs[] | select(.status != "completed")] | length' \
          <<<"$RELEASE_CHECK_RUNS")
        ADVISORY_PENDING=$(jq '[.advisory_check_runs[]? | select(.status != "completed")] | length' \
          <<<"$RELEASE_CHECK_RUNS")
        if [[ "$ADVISORY_PENDING" != "0" ]]; then
          echo "::warning::$ADVISORY_PENDING non-required advisory check(s) remain non-terminal"
          jq -r '.advisory_check_runs[] | select(.status != "completed") | "  - Advisory: \(.name): \(.status)"' \
            <<<"$RELEASE_CHECK_RUNS" || true
        fi
        if [[ "$REMAINING" != "0" ]]; then
          echo "::error::$REMAINING release-owned check runs remained non-terminal after timeout"
          jq -r '.check_runs[] | select(.status != "completed") | "  - \(.name): \(.status)"' \
            <<<"$RELEASE_CHECK_RUNS" || true
          exit 1
        fi
    
    - name: Verify CI/CD Status
      id: cicd
      env:
        GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ steps.release_commit.outputs.sha }}
        RELEASE_TAG: ${{ github.event.inputs.tag || '' }}
        POSTFLIGHT_RUNTIME: ${{ steps.postflight_runtime.outputs.path }}
      run: |
        echo "## CI/CD Pipeline Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Select the latest run for each check name/app pair. GitHub retains
        # superseded runs on a commit, so historical results must not override
        # the latest required evidence.
        SELF_NAME="Verify Release Health"
        CHECK_RUNS_RESPONSE=$(gh api --paginate --slurp \
          "repos/${REPO}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
          | jq -c -f "$POSTFLIGHT_RUNTIME/.agents/scripts/jq/flatten-check-run-pages.jq")
        RELEASE_RUNS_RESPONSE=$(gh api --paginate --slurp \
          "repos/${REPO}/actions/runs?head_sha=${COMMIT_SHA}&per_page=100")
        RECOVERY_RUNS_RESPONSE=$(gh api --paginate --slurp \
          "repos/${REPO}/actions/workflows/publish-packages.yml/runs?event=workflow_dispatch&branch=main&per_page=100")
        RELEASE_CHECK_RUNS=$(jq -c \
          --arg release_sha "$COMMIT_SHA" \
          --arg release_tag "$RELEASE_TAG" \
          --arg self_name "$SELF_NAME" \
          --slurpfile release_run_documents <(printf '%s\n' "$RELEASE_RUNS_RESPONSE") \
          --slurpfile recovery_run_documents <(printf '%s\n' "$RECOVERY_RUNS_RESPONSE") \
          -f "$POSTFLIGHT_RUNTIME/.agents/scripts/jq/release-owned-check-runs.jq" \
          <<<"$CHECK_RUNS_RESPONSE")
        REQUIRED_CHECK_RUNS=$(echo "$RELEASE_CHECK_RUNS" | jq -c '.check_runs')
        ADVISORY_CHECK_RUNS=$(echo "$RELEASE_CHECK_RUNS" | jq -c '.advisory_check_runs')

        # A later push to the default branch can cancel checks on the release
        # commit via cancel-in-progress. Accept only a successful check with the
        # same name/app and workflow path/event on a descendant default-branch
        # commit; real failures and cancellations without provenance remain blocking.
        DESCENDANT_CHECK_RUNS='[]'
        DEFAULT_BRANCH=$(gh api "repos/${REPO}" --jq '.default_branch // empty' 2>/dev/null || true)
        DEFAULT_SHA=$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH}" --jq '.sha // empty' 2>/dev/null || true)
        if [[ -n "$DEFAULT_SHA" && "$DEFAULT_SHA" != "$COMMIT_SHA" ]]; then
          COMPARE_STATUS=$(gh api "repos/${REPO}/compare/${COMMIT_SHA}...${DEFAULT_SHA}" --jq '.status // empty' 2>/dev/null || true)
          # The compare API is base...head: ahead/identical proves DEFAULT_SHA is
          # the release commit or its descendant before replacement evidence is used.
          if [[ "$COMPARE_STATUS" == "ahead" || "$COMPARE_STATUS" == "identical" ]]; then
            DESCENDANT_RESPONSE=$(gh api --paginate --slurp \
              "repos/${REPO}/commits/${DEFAULT_SHA}/check-runs?per_page=100" 2>/dev/null \
              | jq -c -f "$POSTFLIGHT_RUNTIME/.agents/scripts/jq/flatten-check-run-pages.jq" || true)
            DESCENDANT_WORKFLOW_RUNS_RESPONSE=$(gh api --paginate --slurp \
              "repos/${REPO}/actions/runs?head_sha=${DEFAULT_SHA}&per_page=100" 2>/dev/null || true)
            if [[ -n "$DESCENDANT_RESPONSE" && -n "$DESCENDANT_WORKFLOW_RUNS_RESPONSE" ]]; then
              DESCENDANT_CHECK_RUNS=$(echo "$DESCENDANT_RESPONSE" \
                | jq -c --arg self_name "$SELF_NAME" \
                  --slurpfile workflow_run_documents <(printf '%s\n' "$DESCENDANT_WORKFLOW_RUNS_RESPONSE") \
                  -f "$POSTFLIGHT_RUNTIME/.github/scripts/effective-check-runs.jq")
            fi
          fi
        fi
        # Stream large API responses through file descriptors instead of argv.
        # Check-run output payloads can exceed the runner's ARG_MAX limit.
        REQUIRED_CHECK_RUNS=$(jq -cn \
          --slurpfile current_run_documents <(printf '%s\n' "$REQUIRED_CHECK_RUNS") \
          --slurpfile descendant_run_documents <(printf '%s\n' "$DESCENDANT_CHECK_RUNS") \
          -f "$POSTFLIGHT_RUNTIME/.github/scripts/reconcile-superseded-cancellations.jq")
        POSTFLIGHT_CHECKS=$(jq -cn \
          --slurpfile required_documents <(printf '%s\n' "$REQUIRED_CHECK_RUNS") \
          --slurpfile advisory_documents <(printf '%s\n' "$ADVISORY_CHECK_RUNS") \
          '{
            check_runs: ($required_documents[0] // []),
            advisory_check_runs: ($advisory_documents[0] // [])
          }')
        OUTCOME=$(echo "$POSTFLIGHT_CHECKS" \
          | jq -c -f "$POSTFLIGHT_RUNTIME/.agents/scripts/jq/postflight-check-outcome.jq")
        
        # Count required and advisory results separately. Release-owned baseline
        # ratchets remain visible without overriding the PR new-debt gate.
        REQUIRED_TOTAL=$(echo "$OUTCOME" | jq '.required.total')
        REQUIRED_PASSED=$(echo "$OUTCOME" | jq '.required.accepted | length')
        REQUIRED_FAILED=$(echo "$OUTCOME" | jq '.required.failed | length')
        REQUIRED_PENDING=$(echo "$OUTCOME" | jq '.required.pending | length')
        ADVISORY_TOTAL=$(echo "$OUTCOME" | jq '.advisory.total')
        ADVISORY_FAILED=$(echo "$OUTCOME" | jq '.advisory.failed | length')
        ADVISORY_PENDING=$(echo "$OUTCOME" | jq '.advisory.pending | length')

        if [[ "$REQUIRED_TOTAL" == "0" ]]; then
          echo "::error::No terminal check-run evidence exists for release commit ${COMMIT_SHA}"
          exit 1
        fi
        
        echo "| Check | Classification | Reason | Status | Conclusion |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|----------------|--------|--------|------------|" >> $GITHUB_STEP_SUMMARY
        
        # Show the exact required/advisory evidence used for the decision.
        echo "$OUTCOME" \
          | jq -r '(.required.all + .advisory.all)[] | "| \(.name) | \(.classification) | \(.classification_reason) | \(.status) | \(.conclusion // "pending") |"' \
          >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "*Note: latest run per check name/app is used; descendant success may replace a superseded cancellation; 'Verify Release Health' is excluded*" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Required**: $REQUIRED_TOTAL | **Required passed**: $REQUIRED_PASSED | **Required failed**: $REQUIRED_FAILED | **Advisory**: $ADVISORY_TOTAL" >> $GITHUB_STEP_SUMMARY
        
        if [[ "$ADVISORY_FAILED" != "0" ]]; then
          echo "::warning::$ADVISORY_FAILED advisory check(s) failed (non-blocking)"
          echo "$OUTCOME" | jq -r \
            '.advisory.failed[] | "  Advisory failure: \(.name) (\(.conclusion // "missing"); reason=\(.classification_reason))"'
        fi
        if [[ "$ADVISORY_PENDING" != "0" ]]; then
          echo "::warning::$ADVISORY_PENDING advisory check(s) remain non-terminal (non-blocking)"
        fi

        if [[ "$REQUIRED_PENDING" != "0" ]]; then
          echo "::error::$REQUIRED_PENDING required check run(s) remain non-terminal"
          echo "$OUTCOME" | jq -r \
            '.required.pending[] | "  Required pending: \(.name) (\(.status))"'
          echo "cicd_status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi

        if [[ "$REQUIRED_FAILED" != "0" ]]; then
          echo "::error::$REQUIRED_FAILED required check run(s) failed"
          echo "$OUTCOME" | jq -r \
            '.required.failed[] | "  Required failure: \(.name) (\(.conclusion // "missing"); reason=\(.classification_reason))"'
          echo "cicd_status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        if [[ "$ADVISORY_FAILED" != "0" || "$ADVISORY_PENDING" != "0" ]]; then
          echo "cicd_status=warning" >> $GITHUB_OUTPUT
        else
          echo "cicd_status=passed" >> $GITHUB_OUTPUT
        fi
        echo "CI/CD critical checks passed"
    
    - name: Check SonarCloud Quality Gate
      if: always()
      id: sonarcloud
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## SonarCloud Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Get quality gate status
        QG_RESPONSE=$(curl -s "https://sonarcloud.io/api/qualitygates/project_status?projectKey=marcusquinn_aidevops")
        STATUS=$(echo "$QG_RESPONSE" | jq -r '.projectStatus.status // "UNKNOWN"')
        
        echo "**Quality Gate**: $STATUS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Get metrics
        METRICS=$(curl -s "https://sonarcloud.io/api/measures/component?component=marcusquinn_aidevops&metricKeys=bugs,vulnerabilities,code_smells,security_hotspots")
        
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "$METRICS" | jq -r '.component.measures[] | "| \(.metric) | \(.value) |"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
        
        if [[ "$STATUS" == "ERROR" ]]; then
          echo "::warning::SonarCloud quality gate failed"
          echo "sonar_status=failed" >> $GITHUB_OUTPUT
        elif [[ "$STATUS" == "OK" ]]; then
          echo "sonar_status=passed" >> $GITHUB_OUTPUT
        else
          echo "sonar_status=unknown" >> $GITHUB_OUTPUT
        fi
      continue-on-error: true
    
    - name: Generate Final Report
      id: report
      if: always()
      env:
        CICD_STATUS: ${{ steps.cicd.outputs.cicd_status }}
        SONAR_STATUS: ${{ steps.sonarcloud.outputs.sonar_status }}
        RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        COMMIT_SHA: ${{ steps.release_commit.outputs.sha }}
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Postflight Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Default unset outputs to 'skipped' (step didn't produce output)
        CICD="${CICD_STATUS:-skipped}"
        SONAR="${SONAR_STATUS:-skipped}"
        
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| CI/CD Pipelines | ${CICD} |" >> $GITHUB_STEP_SUMMARY
        echo "| SonarCloud | ${SONAR} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Release**: ${RELEASE_TAG}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: ${COMMIT_SHA}" >> $GITHUB_STEP_SUMMARY
        echo "**Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "*Generated by AI DevOps Framework Postflight Verification*" >> $GITHUB_STEP_SUMMARY
        
        # Determine overall result
        # Critical failures: terminal CI/CD hard failures.
        HAS_CRITICAL=false
        HAS_WARNING=false
        
        if [[ "$CICD" == "failed" ]]; then
          HAS_CRITICAL=true
        fi
        # Warnings: advisory failures or SonarCloud issues.
        if [[ "$CICD" == "warning" || "$SONAR" == "failed" ]]; then
          HAS_WARNING=true
        fi
        
        if [[ "$HAS_CRITICAL" == "true" ]]; then
          echo "::error::Postflight verification failed for release ${RELEASE_TAG}"
          echo ""
          echo "Recommended actions:"
          echo "1. Review the failed checks in the workflow summary"
          echo "2. If critical issues found, consider rollback"
          echo "3. See: .agents/workflows/postflight.md#rollback-procedures"
          exit 1
        elif [[ "$HAS_WARNING" == "true" ]]; then
          echo "::warning::Postflight completed with warnings for release ${RELEASE_TAG}"
          echo "Review advisory warnings above and address in next release if needed."
        else
          echo "Postflight verification passed for release ${RELEASE_TAG}"
        fi
