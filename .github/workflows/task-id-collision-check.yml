name: Task-ID Collision Check

# Belt-and-braces server-side enforcement for the task-id-collision-guard hook.
# Catches commits authored outside the hook (web UI, external contributors,
# --no-verify bypasses) on push and pull_request events.
#
# The hook (client-side) and this workflow (server-side) implement the same
# logic via task-id-collision-guard.sh check-pr/check-push modes.

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'TODO.md'
      - 'todo/**'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'TODO.md'
      - 'todo/**'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  task-id-collision-check:
    name: Task-ID Collision Guard
    runs-on: ubuntu-latest
    # Belt: cap the job at 5 minutes. Healthy runs complete in 16-52s on
    # small PRs; the t2895 fix bounds the scan range to commits unique to
    # the branch (excluding upstream commits brought in by merges from main).
    # If a regression slips through, the cap surfaces it as a CI failure
    # instead of a 21+ minute hang that has to be cancelled by hand.
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Full history needed for merge-base detection

      - name: Fetch comparison and task counter branches
        run: |
          git fetch origin main --depth=100 2>/dev/null || true
          git fetch origin develop --depth=100 2>/dev/null || true
          git fetch origin '+refs/heads/task-id-counter:refs/remotes/origin/task-id-counter' --depth=100 2>/dev/null || true

      - name: Run task-id collision check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_ID_GUARD_DEBUG: "0"
        run: |
          GUARD=".agents/hooks/task-id-collision-guard.sh"
          if [[ ! -f "$GUARD" ]]; then
            echo "[task-id-guard][WARN] Guard script not found at $GUARD — skipping"
            exit 0
          fi
          chmod +x "$GUARD"

          # Determine PR number (for check-pr mode) or use push range
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [[ -n "$PR_NUMBER" ]]; then
            echo "Running check-pr for PR #${PR_NUMBER}"
            bash "$GUARD" check-pr "$PR_NUMBER"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            echo "Push range: ${BEFORE}..${AFTER}"
            bash "$GUARD" check-push "$BEFORE" "$AFTER"
          fi
