name: Post-Merge Brief Verification

# Keep post-merge acceptance checks on the same pinned Qlty CLI as required PR
# quality gates. Brief verify blocks may call the repository Qlty helpers.
env:
  QLTY_VERSION: "0.636.0"

# t2135: After a PR merges to main, extract the task ID from the PR title,
# locate the corresponding brief file, parse verify: YAML blocks from its
# acceptance criteria, and run method:bash blocks. On any failure, open a
# follow-up issue linking the merged PR and the failed criteria.
#
# This catches cases where a PR ships code that does not satisfy the
# machine-checkable acceptance criteria defined in the brief.

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: post-merge-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-brief:
    name: Verify Brief Acceptance Criteria
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---------------------------------------------------------------
      # Step 1: Extract task ID from PR title (tNNN pattern)
      # ---------------------------------------------------------------
      - name: Extract task ID from PR title
        id: extract
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Match tNNN anywhere in the title (handles GH#NNN: tNNN: prefixes)
          TASK_ID=""
          if echo "$PR_TITLE" | grep -qE 't[0-9]+'; then
            TASK_ID=$(echo "$PR_TITLE" | grep -oE 't[0-9]+(\.[0-9]+)*' | head -1)
          fi
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

          if [[ -z "$TASK_ID" ]]; then
            echo "No task ID found in PR title — skipping brief verification."
          else
            echo "Task ID: $TASK_ID"
          fi

      # ---------------------------------------------------------------
      # Step 2: Checkout the exact merge commit (not the moving main ref)
      # ---------------------------------------------------------------
      - name: Checkout code
        if: steps.extract.outputs.task_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # Acceptance checks are authored before merge and commonly diff against
      # origin/<base>. Pin that ref to the event's pre-merge base SHA instead of
      # leaving it absent in the detached checkout or pointing at moving main.
      - name: Pin verification base ref
        if: steps.extract.outputs.task_id != ''
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          REMOTE_BASE_REF="refs/remotes/origin/${BASE_REF}"

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pull request base SHA."
            exit 1
          fi
          git check-ref-format "$REMOTE_BASE_REF"
          git cat-file -e "${BASE_SHA}^{commit}"
          git update-ref "$REMOTE_BASE_REF" "$BASE_SHA"

      # ---------------------------------------------------------------
      # Step 3: Check if brief exists and has verify blocks
      # ---------------------------------------------------------------
      - name: Check brief exists
        if: steps.extract.outputs.task_id != ''
        id: brief
        env:
          TASK_ID: ${{ steps.extract.outputs.task_id }}
        run: |
          BRIEF_PATH="todo/tasks/${TASK_ID}-brief.md"
          if [[ -f "$BRIEF_PATH" ]]; then
            # Quick check: does the brief contain any verify: blocks?
            if grep -q 'verify:' "$BRIEF_PATH"; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "path=$BRIEF_PATH" >> "$GITHUB_OUTPUT"
              echo "Brief found at $BRIEF_PATH with verify blocks"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "Brief found at $BRIEF_PATH but contains no verify: blocks — skipping."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No brief found at $BRIEF_PATH — skipping."
          fi

      - name: Setup Bun
        if: steps.brief.outputs.exists == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Qlty CLI
        if: steps.brief.outputs.exists == 'true'
        uses: qltysh/qlty-action/install@a19242102d17e497f437d7466aa01b528537e899 # v2.2.0

      - name: Install verification dependencies
        if: steps.brief.outputs.exists == 'true'
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          bun install --frozen-lockfile --ignore-scripts

      # ---------------------------------------------------------------
      # Step 4: Run verify blocks
      # ---------------------------------------------------------------
      - name: Run verify blocks
        if: steps.brief.outputs.exists == 'true'
        id: verify
        env:
          BRIEF_PATH: ${{ steps.brief.outputs.path }}
          # Verify blocks may invoke gh-backed helpers, so propagate the
          # permission-scoped workflow token into their shell context.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e  # Capture exit code without failing the step
          chmod +x .agents/scripts/verify-brief-helper.sh
          VERIFY_OUTPUT_FILE="$RUNNER_TEMP/verify-output.txt"
          .agents/scripts/verify-brief-helper.sh verify "$BRIEF_PATH" > "$VERIFY_OUTPUT_FILE" 2>&1
          EXIT_CODE=$?
          set -e

          # Bound content before logs, step summaries, comments, or issues use it.
          bash .agents/scripts/post-merge-verify-report-helper.sh \
            truncate-output "$VERIFY_OUTPUT_FILE" 60000
          cat "$VERIFY_OUTPUT_FILE"

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # Step 5: Post summary comment on the PR
      # ---------------------------------------------------------------
      - name: Post PR comment with results
        if: always() && steps.verify.outputs.exit_code != '' && steps.brief.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          REPO: ${{ github.repository }}
        run: |
          VERIFY_OUTPUT=$(<"$RUNNER_TEMP/verify-output.txt")
          if [[ "$EXIT_CODE" == "0" ]]; then
            STATUS="✅ All verify blocks passed"
          elif [[ "$EXIT_CODE" == "3" ]]; then
            STATUS="⚠️ Infrastructure failure prevented verification"
          else
            STATUS="❌ One or more verify blocks failed"
          fi

          COMMENT_BODY="## Post-Merge Brief Verification

          **Task:** ${TASK_ID} | **Status:** ${STATUS}

          <details>
          <summary>Verification output</summary>

          \`\`\`
          ${VERIFY_OUTPUT}
          \`\`\`

          </details>

          Brief: \`todo/tasks/${TASK_ID}-brief.md\`"

          # Dedent the heredoc content
          COMMENT_BODY=$(echo "$COMMENT_BODY" | sed 's/^          //')

          REPORT_FILE="$RUNNER_TEMP/post-merge-verify-report.md"
          printf '%s\n' "$COMMENT_BODY" > "$REPORT_FILE"
          printf '%s\n' "$COMMENT_BODY" >> "$GITHUB_STEP_SUMMARY"

          chmod +x .agents/scripts/post-merge-verify-report-helper.sh
          .agents/scripts/post-merge-verify-report-helper.sh \
            publish-comment "$REPO" "$PR_NUMBER" "$REPORT_FILE"

      # ---------------------------------------------------------------
      # Step 6: Create follow-up issue on failure
      # ---------------------------------------------------------------
      - name: Create follow-up issue on failure
        if: always() && steps.verify.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          VERIFY_OUTPUT=$(<"$RUNNER_TEMP/verify-output.txt")
          TITLE="${TASK_ID}: post-merge brief verification failed"

          BODY="## Post-Merge Verification Failure

          PR #${PR_NUMBER} merged but one or more \`verify:\` acceptance criteria in \`todo/tasks/${TASK_ID}-brief.md\` failed.

          ### Verification Output

          \`\`\`
          ${VERIFY_OUTPUT}
          \`\`\`

          ### Action Required

          Review the failed criteria and either:
          1. Fix the underlying issue in a follow-up PR
          2. Update the brief if the criteria are no longer applicable

          ---
          <!-- aidevops:generator=post-merge-verify -->
          Ref: PR #${PR_NUMBER} | Task: ${TASK_ID}"

          # Dedent the heredoc content
          BODY=$(echo "$BODY" | sed 's/^          //')

          gh issue create --repo "$REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "quality-debt"

      # Comment publication is deliberately fail-soft. This final step exposes
      # the original typed verification outcome as the workflow conclusion.
      - name: Finalize verification result
        if: always() && steps.verify.outputs.exit_code != ''
        env:
          EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          case "$EXIT_CODE" in
            0)
              exit 0
              ;;
            1)
              echo "::error::Brief acceptance-criteria verification failed."
              exit 1
              ;;
            *)
              echo "::error::Brief verification infrastructure failed (exit code ${EXIT_CODE}); retry with an authenticated GitHub context."
              exit 1
              ;;
          esac
