name: Publish Packages

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Verify immutable release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bash .agents/scripts/release-provenance-helper.sh verify \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24 ships npm 11.5+ which natively supports OIDC Trusted Publishers.
          # Do NOT downgrade to 22 + `npm install -g npm@latest` — that self-replaces
          # the running npm process mid-install and dies with
          # `Cannot find module 'promise-retry'` (broke 100+ releases between
          # v3.5.896 and v3.8.1, fixed in t2043 / GH#18572).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Verify npm version is sufficient for Trusted Publishers (≥11.5.1).
      # Assertion-only: never self-update the running npm process.
      - name: Verify npm version supports Trusted Publishers
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          REQUIRED="11.5.1"
          if [ "$(printf '%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -n1)" != "$REQUIRED" ]; then
            echo "::error::npm $NPM_VERSION < $REQUIRED required for Trusted Publishers. Bump node-version in setup-node step."
            exit 1
          fi
      
      - name: Get version
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      
      # No token needed - uses OIDC Trusted Publisher authentication
      - name: Publish to npm
        run: npm publish --provenance --access public
      
      - name: Summary
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## npm Package Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $PKG_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Auth:** Trusted Publisher (OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install -g aidevops && aidevops update" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Verify immutable release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bash .agents/scripts/release-provenance-helper.sh verify \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Get version and SHA
        id: release
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
          # Get SHA256 of the release tarball (fail on HTTP errors)
          TARBALL_URL="https://github.com/marcusquinn/aidevops/archive/refs/tags/v${VERSION}.tar.gz"
          if ! SHA256=$(curl -fsSL "$TARBALL_URL" | sha256sum | cut -d' ' -f1); then
            echo "::error::Failed to download tarball for SHA256 calculation"
            exit 1
          fi
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
      
      - name: Update Homebrew formula
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          # Update the formula with new version and SHA
          sed -i "s|url \"https://github.com/marcusquinn/aidevops/archive/refs/tags/v.*\.tar\.gz\"|url \"https://github.com/marcusquinn/aidevops/archive/refs/tags/v${RELEASE_VERSION}.tar.gz\"|" homebrew/aidevops.rb
          sed -i "s|sha256 \".*\"|sha256 \"${RELEASE_SHA256}\"|" homebrew/aidevops.rb

      - name: Push to homebrew-tap repo
        # Pinned to commit SHA for security
        uses: dmnemec/copy_file_to_another_repo_action@bbebd3da22e4a37d04dca5f782edd5201cb97083
        env:
          API_TOKEN_GITHUB: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        with:
          source_file: 'homebrew/aidevops.rb'
          destination_repo: 'marcusquinn/homebrew-tap'
          destination_folder: 'Formula'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          user_name: 'github-actions[bot]'
          commit_message: 'Update aidevops to v${{ steps.release.outputs.version }}'
        continue-on-error: true
      
      - name: Summary
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          echo "## Homebrew Tap Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $RELEASE_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256:** $RELEASE_SHA256" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "brew install marcusquinn/tap/aidevops && aidevops update" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** If the tap repo doesn't exist yet, create it first:" >> $GITHUB_STEP_SUMMARY
          echo "1. Create repo: marcusquinn/homebrew-tap" >> $GITHUB_STEP_SUMMARY
          echo "2. Add Formula/ directory" >> $GITHUB_STEP_SUMMARY
          echo "3. Set HOMEBREW_TAP_TOKEN secret with repo write access" >> $GITHUB_STEP_SUMMARY
