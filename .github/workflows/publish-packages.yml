name: Publish Release
run-name: Publish ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag to reconcile
        required: true
        type: string

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub, npm, and Homebrew
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_EVENT: ${{ github.event_name }}
      RELEASE_REF: ${{ github.ref }}

    steps:
      - name: Checkout verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Verify immutable release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          }
          if [[ "$RELEASE_EVENT" == "push" ]]; then
            [[ "$RELEASE_REF" == "refs/tags/${RELEASE_TAG}" ]] || {
              echo "::error::Tag event ref does not match $RELEASE_TAG"
              exit 1
            }
          elif [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            [[ "$RELEASE_REF" == "refs/heads/main" ]] || {
              echo "::error::Recovery must use the reviewed default branch workflow"
              exit 1
            }
          else
            echo "::error::Unsupported publication event: $RELEASE_EVENT"
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          CHECKOUT_COMMIT=$(git rev-parse HEAD)
          [[ "$CHECKOUT_COMMIT" == "$TAG_COMMIT" ]] || {
            echo "::error::Checkout $CHECKOUT_COMMIT does not match tag commit $TAG_COMMIT"
            exit 1
          }
          LATEST_TAG=""
          while IFS= read -r CANDIDATE_TAG; do
            [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            LATEST_TAG="$CANDIDATE_TAG"
            break
          done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname)
          [[ -n "$LATEST_TAG" && "$RELEASE_TAG" == "$LATEST_TAG" ]] || {
            echo "::error::Refusing stale release $RELEASE_TAG; newest tag is ${LATEST_TAG:-unknown}"
            exit 1
          }
          bash .agents/scripts/release-provenance-helper.sh verify \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Extract CHANGELOG section
        run: |
          VERSION="${RELEASE_TAG#v}"
          BODY=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | sed '$d')
          PREV_TAG=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          if [[ -n "$PREV_TAG" ]]; then
            EXTRA=$(git log --oneline --max-count=10 --invert-grep \
              --grep='^chore: claim t' "$PREV_TAG..$RELEASE_TAG" --)
            BODY="$BODY"$'\n\n### Commits since CHANGELOG generation\n'"$EXTRA"
          fi
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/release-notes.md"

      - name: Create or reconcile GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .agents/scripts/github-release-helper.sh create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --reconcile-existing

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm 11.5+ which natively supports OIDC Trusted Publishers.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm version supports Trusted Publishers
        run: |
          NPM_VERSION=$(npm --version)
          REQUIRED="11.5.1"
          echo "npm version: $NPM_VERSION"
          if [[ "$(printf '%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -n1)" != "$REQUIRED" ]]; then
            echo "::error::npm $NPM_VERSION < $REQUIRED required for Trusted Publishers"
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cat VERSION)
          [[ "$RELEASE_TAG" == "v${VERSION}" ]] || {
            echo "::error::Tag $RELEASE_TAG does not match VERSION $VERSION"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check npm publication state
        id: npm-state
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VIEW_OUTPUT=""
          if VIEW_OUTPUT=$(npm view "aidevops@${RELEASE_VERSION}" version --json 2>&1); then
            PUBLISHED=$(jq -er 'if type == "array" then .[0] else . end' <<<"$VIEW_OUTPUT")
            [[ "$PUBLISHED" == "$RELEASE_VERSION" ]] || {
              echo "::error::Registry returned $PUBLISHED for requested version $RELEASE_VERSION"
              exit 1
            }
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qE 'E404|No match found' <<<"$VIEW_OUTPUT"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unable to determine npm publication state"
            printf '%s\n' "$VIEW_OUTPUT" >&2
            exit 1
          fi

      # No token needed: npm verifies this workflow and environment through OIDC.
      - name: Publish to npm
        if: steps.npm-state.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Verify npm publication
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in {1..12}; do
            PUBLISHED=$(npm view "aidevops@${RELEASE_VERSION}" version --json 2>/dev/null \
              | jq -r 'if type == "array" then .[0] // "" else . // "" end' || true)
            [[ "$PUBLISHED" == "$RELEASE_VERSION" ]] && exit 0
            sleep 5
          done
          echo "::error::npm did not converge to $RELEASE_VERSION"
          exit 1

      - name: Build Homebrew formula
        id: homebrew
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARBALL_URL="https://github.com/marcusquinn/aidevops/archive/refs/tags/v${RELEASE_VERSION}.tar.gz"
          SHA256=$(curl -fsSL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)
          sed -i "s|url \"https://github.com/marcusquinn/aidevops/archive/refs/tags/v.*\.tar\.gz\"|url \"$TARBALL_URL\"|" homebrew/aidevops.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" homebrew/aidevops.rb
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Check Homebrew tap state
        id: tap-state
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          CURRENT="$RUNNER_TEMP/aidevops.rb"
          TAP_JSON=""
          if ! TAP_JSON=$(gh api \
            repos/marcusquinn/homebrew-tap/contents/Formula/aidevops.rb 2>&1); then
            echo "::error::Unable to determine Homebrew tap publication state"
            exit 1
          fi
          if ! jq -er '.content' <<<"$TAP_JSON" | base64 --decode > "$CURRENT"; then
            echo "::error::Homebrew tap returned malformed formula content"
            exit 1
          fi
          if cmp -s homebrew/aidevops.rb "$CURRENT"; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to Homebrew tap
        if: steps.tap-state.outputs.current != 'true'
        # Pinned to commit SHA for security.
        uses: dmnemec/copy_file_to_another_repo_action@bbebd3da22e4a37d04dca5f782edd5201cb97083
        env:
          API_TOKEN_GITHUB: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        with:
          source_file: 'homebrew/aidevops.rb'
          destination_repo: 'marcusquinn/homebrew-tap'
          destination_folder: 'Formula'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          user_name: 'github-actions[bot]'
          commit_message: 'Update aidevops to v${{ steps.version.outputs.version }}'

      - name: Verify Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          CURRENT="$RUNNER_TEMP/aidevops-verified.rb"
          for attempt in {1..12}; do
            if gh api repos/marcusquinn/homebrew-tap/contents/Formula/aidevops.rb \
              --jq '.content' | base64 --decode > "$CURRENT" \
              && cmp -s homebrew/aidevops.rb "$CURRENT"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Homebrew tap did not converge to $RELEASE_TAG"
          exit 1

      - name: Publication summary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA256: ${{ steps.homebrew.outputs.sha256 }}
        run: |
          echo "## Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**GitHub:** reconciled" >> "$GITHUB_STEP_SUMMARY"
          echo "**npm:** verified through Trusted Publisher (OIDC)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Homebrew SHA256:** $RELEASE_SHA256" >> "$GITHUB_STEP_SUMMARY"
