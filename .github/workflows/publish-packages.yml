name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing signed aidevops release tag'
        required: true
        type: string
      request_id:
        description: 'Non-secret dispatch correlation identifier'
        required: true
        type: string

run-name: ${{ inputs.request_id && format('Publish packages for {0} ({1})', inputs.tag, inputs.request_id) || format('Publish packages for {0}', github.event.release.tag_name) }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Verify published release and immutable provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Release input $RELEASE_TAG does not match event ref $GITHUB_REF"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && ! "$DISPATCH_REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::Invalid package dispatch request identity"
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "$GITHUB_SHA" != "$TAG_COMMIT" ]]; then
            echo "::error::Release event SHA $GITHUB_SHA does not match tag commit $TAG_COMMIT"
            exit 1
          fi
          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag
            and .draft == false
            and ((.published_at // "") | length > 0)
          ' <<<"$RELEASE_JSON" >/dev/null
          bash .agents/scripts/release-provenance-helper.sh verify \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm 11.5+ which natively supports OIDC Trusted Publishers.
          # Do NOT downgrade to 22 + `npm install -g npm@latest` — that self-replaces
          # the running npm process mid-install and dies with
          # `Cannot find module 'promise-retry'` (broke 100+ releases between
          # v3.5.896 and v3.8.1, fixed in t2043 / GH#18572).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Verify npm version is sufficient for Trusted Publishers (≥11.5.1).
      # Assertion-only: never self-update the running npm process.
      - name: Verify npm version supports Trusted Publishers
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          REQUIRED="11.5.1"
          if [ "$(printf '%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -n1)" != "$REQUIRED" ]; then
            echo "::error::npm $NPM_VERSION < $REQUIRED required for Trusted Publishers. Bump node-version in setup-node step."
            exit 1
          fi
      
      - name: Get version
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check npm publication state
        id: npm-state
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VIEW_OUTPUT=""
          if VIEW_OUTPUT=$(npm view "aidevops@$PKG_VERSION" version --json 2>&1); then
            PUBLISHED_VERSION=$(jq -er 'if type == "array" then .[0] else . end' <<<"$VIEW_OUTPUT")
            if [[ "$PUBLISHED_VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::Registry returned $PUBLISHED_VERSION for requested version $PKG_VERSION"
              exit 1
            fi
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE 'E404|No match found' <<<"$VIEW_OUTPUT"; then
            echo "already-published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Unable to determine npm publication state"
          printf '%s\n' "$VIEW_OUTPUT" >&2
          exit 1
      
      # No token needed - uses OIDC Trusted Publisher authentication
      - name: Publish to npm
        if: steps.npm-state.outputs.already-published != 'true'
        run: npm publish --provenance --access public
      
      - name: Summary
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## npm Package Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $PKG_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Auth:** Trusted Publisher (OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install -g aidevops && aidevops update" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    environment: release
    needs: publish-npm
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Verify published release and immutable provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Release input $RELEASE_TAG does not match event ref $GITHUB_REF"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && ! "$DISPATCH_REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::Invalid package dispatch request identity"
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "$GITHUB_SHA" != "$TAG_COMMIT" ]]; then
            echo "::error::Release event SHA $GITHUB_SHA does not match tag commit $TAG_COMMIT"
            exit 1
          fi
          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag
            and .draft == false
            and ((.published_at // "") | length > 0)
          ' <<<"$RELEASE_JSON" >/dev/null
          bash .agents/scripts/release-provenance-helper.sh verify \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Get version and SHA
        id: release
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
          # Get SHA256 of the release tarball (fail on HTTP errors)
          TARBALL_URL="https://github.com/marcusquinn/aidevops/archive/refs/tags/v${VERSION}.tar.gz"
          if ! SHA256=$(curl -fsSL "$TARBALL_URL" | sha256sum | cut -d' ' -f1); then
            echo "::error::Failed to download tarball for SHA256 calculation"
            exit 1
          fi
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
      
      - name: Update Homebrew formula
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          # Update the formula with new version and SHA
          sed -i "s|url \"https://github.com/marcusquinn/aidevops/archive/refs/tags/v.*\.tar\.gz\"|url \"https://github.com/marcusquinn/aidevops/archive/refs/tags/v${RELEASE_VERSION}.tar.gz\"|" homebrew/aidevops.rb
          sed -i "s|sha256 \".*\"|sha256 \"${RELEASE_SHA256}\"|" homebrew/aidevops.rb

      - name: Push to homebrew-tap repo
        # Pinned to commit SHA for security
        uses: dmnemec/copy_file_to_another_repo_action@bbebd3da22e4a37d04dca5f782edd5201cb97083
        env:
          API_TOKEN_GITHUB: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        with:
          source_file: 'homebrew/aidevops.rb'
          destination_repo: 'marcusquinn/homebrew-tap'
          destination_folder: 'Formula'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          user_name: 'github-actions[bot]'
          commit_message: 'Update aidevops to v${{ steps.release.outputs.version }}'
      
      - name: Summary
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          echo "## Homebrew Tap Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $RELEASE_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256:** $RELEASE_SHA256" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "brew install marcusquinn/tap/aidevops && aidevops update" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** If the tap repo doesn't exist yet, create it first:" >> $GITHUB_STEP_SUMMARY
          echo "1. Create repo: marcusquinn/homebrew-tap" >> $GITHUB_STEP_SUMMARY
          echo "2. Add Formula/ directory" >> $GITHUB_STEP_SUMMARY
          echo "3. Set HOMEBREW_TAP_TOKEN secret with repo write access" >> $GITHUB_STEP_SUMMARY
