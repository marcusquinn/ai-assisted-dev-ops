#
# Thin self-caller. Policy logic lives in linked-issue-check-reusable.yml so
# managed repositories can consume the same gate without copied-workflow drift.

name: Linked Issue Check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: read
  pull-requests: read
  statuses: write

jobs:
  check:
    uses: ./.github/workflows/linked-issue-check-reusable.yml
