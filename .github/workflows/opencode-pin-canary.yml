name: OpenCode Pin Canary

on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      candidate:
        description: OpenCode candidate version (or latest)
        default: latest
        required: false

permissions:
  contents: read

jobs:
  linux-headless-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Evaluate candidate
        id: canary
        continue-on-error: true
        env:
          CANDIDATE: ${{ inputs.candidate || 'latest' }}
        run: |
          set -o pipefail
          : > canary-result.txt
          .agents/scripts/opencode-pin-canary.sh status | tee pin-status.txt
          .agents/scripts/opencode-pin-canary.sh canary "$CANDIDATE" 2>&1 | tee canary-result.txt

      - name: Preserve canary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencode-pin-canary-evidence
          path: |
            pin-status.txt
            canary-result.txt
          if-no-files-found: warn
          retention-days: 7

  record-review:
    needs: linux-headless-canary
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download canary evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: opencode-pin-canary-evidence

      - name: Record actionable compatibility review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if grep -q '^RESULT=pass$' canary-result.txt 2>/dev/null; then
            title="Promote passing OpenCode compatibility candidate"
            summary="The scheduled isolated Linux-headless OpenCode candidate canary passed."
          else
            title="OpenCode compatibility pin review is due"
            summary="The scheduled isolated Linux-headless OpenCode candidate canary did not pass."
          fi
          existing=$(gh api "repos/${REPO}/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"${title}\") | .number" | command head -n 1)
          [[ -n "$existing" ]] && exit 0
          status=$(<pin-status.txt)
          result=$(<canary-result.txt)
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$summary" \
            "Status: ${status}" "Result: ${result}" \
            'Files: `.agents/scripts/shared-constants.sh`, `.agents/plugins/opencode-aidevops/package.json`, and `.agents/plugins/opencode-aidevops/package-lock.json`. Retain the current fail-closed pin after failed or inconclusive results; after a passing rerun, advance the tested version, dates, result, and plugin lock together. Verify with `.agents/scripts/tests/test-opencode-pin-policy.sh` and the workflow canary.')
          gh api --method POST "repos/${REPO}/issues" -f title="$title" -f body="$body" \
            -f 'labels[]=origin:worker' -f 'labels[]=status:in-review' >/dev/null
