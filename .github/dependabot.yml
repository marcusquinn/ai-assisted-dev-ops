version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 7
    # qlty-action/install v2.3.0 removed deterministic QLTY_VERSION handling
    # and resolves a moving latest CLI. Keep v2.2.0 until a later action
    # release restores an explicit version input.
    ignore:
      - dependency-name: "qltysh/qlty-action"
        versions:
          - "2.3.0"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
