  <rect x="82" y="386" width="1036" height="102" rx="26" fill="#050b0d" stroke="#153d43"/>
  <g fill="#8ce8ff" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle">
    <text x="211" y="431" data-count="main_agents">14</text>
    <text x="470" y="431" data-count="subagents">600+</text>
    <text x="729" y="431" data-count="scripts">460+</text>
    <text x="988" y="431" data-count="slash_commands">100+</text>
  </g>
  <g fill="#c9d1d9" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <text x="211" y="463">main agents</text>
    <text x="470" y="463">sub agents</text>
    <text x="729" y="463">helper scripts</text>
    <text x="988" y="463">slash commands</text>
  </g>
</svg>
