<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI DevOps hero headline overlay</title>
  <desc id="desc">Designed for speed, token-efficiency, security, and infinite scaling of AI teamwork. Replaces only the top-line and headline regions of the existing hero.</desc>
  <!-- Background definitions from https://github.com/marcusquinn/aidevops.sh/blob/main/og-image.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.58" stop-color="#030707"/>
      <stop offset="1" stop-color="#071013"/>
    </linearGradient>
    <radialGradient id="glow" cx="34%" cy="30%" r="62%">
      <stop offset="0" stop-color="#66d9f2" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#66d9f2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#66d9f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="84%" cy="82%" r="58%">
      <stop offset="0" stop-color="#0d6f84" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0d6f84" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <clipPath id="copy-regions">
      <rect x="70" y="35" width="1060" height="40"/>
      <rect x="256" y="228" width="862" height="84"/>
    </clipPath>
  </defs>
  <g clip-path="url(#copy-regions)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow)"/>
    <rect width="1200" height="630" fill="url(#glow2)"/>
    <!-- Preserve the original terminal tile's shadow beneath the copy region. -->
    <g transform="translate(82 86)" filter="url(#shadow)">
      <rect width="156" height="156" rx="32" fill="#000000"/>
      <rect x="10" y="10" width="136" height="136" rx="27" fill="none" stroke="#66d9f2" stroke-opacity="0.38" stroke-width="4"/>
    </g>
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text id="top-line" x="600" y="62" text-anchor="middle" fill="#66d9f2" font-size="16.5" font-weight="800" letter-spacing="1.95" textLength="1036" lengthAdjust="spacingAndGlyphs">BUILD WEBSITES, APPS, CONTENT, MARKETING, SEO, BRAND ASSETS, AND BUSINESS AUTOMATIONS</text>
      <text x="268" y="262" fill="#ffffff" font-size="33" font-weight="760" letter-spacing="-1.5">Designed for speed, token-efficiency, security,</text>
      <text x="268" y="302" fill="#ffffff" font-size="33" font-weight="760" letter-spacing="-1.5">and infinite scaling of AI teamwork</text>
    </g>
  </g>
</svg>
