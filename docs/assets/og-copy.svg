<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">AI DevOps hero copy</title>
  <desc id="description">Transparent browser overlay that centres the capability top-line and updates the AI DevOps headline.</desc>
  <defs>
    <!-- Match the website og-image.svg background definitions exactly. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.58" stop-color="#030707"/>
      <stop offset="1" stop-color="#071013"/>
    </linearGradient>
    <radialGradient id="glow" cx="34%" cy="30%" r="62%">
      <stop offset="0" stop-color="#66d9f2" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#66d9f2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#66d9f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="84%" cy="82%" r="58%">
      <stop offset="0" stop-color="#0d6f84" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0d6f84" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="copy-patches">
      <!-- Approved changed-pixel rectangles: top-line and headline only. -->
      <rect x="81" y="43" width="1038" height="24"/>
      <rect x="267" y="230" width="851" height="79"/>
    </clipPath>
  </defs>
  <g clip-path="url(#copy-patches)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow)"/>
    <rect width="1200" height="630" fill="url(#glow2)"/>
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="600" y="62" fill="#66d9f2" font-size="17" font-weight="800" letter-spacing="1.95" text-anchor="middle" textLength="1036" lengthAdjust="spacingAndGlyphs">BUILD WEBSITES, APPS, CONTENT, MARKETING, SEO, BRAND ASSETS, AND BUSINESS AUTOMATIONS</text>
      <text x="268" y="263" fill="#ffffff" font-size="30" font-weight="760" letter-spacing="-1.25">Designed for speed, token-efficiency, security,</text>
      <text x="268" y="300" fill="#ffffff" font-size="30" font-weight="760" letter-spacing="-1.25">and infinite scaling of AI teamwork.</text>
    </g>
  </g>
</svg>
